name: push-build-release
run-name: ${{ github.actor }} ${{ github.event_name }} to ${{ github.event.pull_request.base.ref }} 
on:

  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main,develop]
jobs:
  build_test_package:
    strategy:
      matrix:
        os: [ubuntu-latest,macos-latest,windows-latest]

    uses: EddyTheCo/Common/.github/workflows/build-test-install.yml@v0.6.0
    with:
      os: ${{ matrix.os }}
      qtModules: 'qtshadertools qtmultimedia'
      qtVersion: '6.10.0'


  release-deploy:
    if: (startsWith(github.ref, 'refs/tags/v')) }}
    needs: [build_test_package]
    uses: EddyTheCo/Common/.github/workflows/release.yml@v0.6.0
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      pages: write
      id-token: write

